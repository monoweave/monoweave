compressionLevel: mixed

enableScripts: false

logFilters:
  - code: YN0060
    level: error
  - code: YN0002
    level: error
  - level: discard
    pattern: "lists build scripts, but its build has been explicitly disabled through configuration"
  - level: discard
    pattern: react is listed by your project with version *

npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - "@yarnpkg/*"

packageExtensions:
  "@docusaurus/bundler@*":
    dependencies:
      "@docusaurus/faster": "*"
  docusaurus-plugin-typedoc@*:
    dependencies:
      typedoc: "*"
      typedoc-plugin-markdown: "*"
  typedoc-docusaurus-theme@*:
    dependencies:
      typedoc: "*"
  typedoc@*:
    dependencies:
      typedoc-docusaurus-theme: "*"
      typedoc-plugin-markdown: "*"

supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - darwin
    - linux
    - win32
